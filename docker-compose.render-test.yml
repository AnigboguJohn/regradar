# Rehearsal of the Render deployment on your own computer: the single-container image
# (Dockerfile.render) with Render's free-plan memory limit (512 MB), plus an empty database
# standing in for Neon. The browser tests can run against it:
#
#   docker compose -p regradar-render -f docker-compose.render-test.yml up -d --build --wait
#   cd tests/browser && COMPOSE="docker compose -p regradar-render -f docker-compose.render-test.yml" \
#     BASE_URL=http://localhost:8095 npx playwright test
#   docker compose -p regradar-render -f docker-compose.render-test.yml down -v
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: regradar
      POSTGRES_PASSWORD: regradar
      POSTGRES_DB: regradar
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regradar"]
      interval: 3s
      retries: 30

  api:   # the whole of RegRadar in one container, as on Render
    build:
      context: .
      dockerfile: Dockerfile.render
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://regradar:regradar@db:5432/regradar
      JWT_SECRET: render-rehearsal-secret
      INTERNAL_TOKEN: render-rehearsal-token
      CRON_SECRET: render-rehearsal-cron
      RENDER_EXTERNAL_URL: http://localhost:8095
      CRON_INTERVAL_MINUTES: "0"
      OPS_MONITOR_MINUTES: "0"
      AUTH_RATE_LIMIT: "1000"
      RESET_RATE_LIMIT: "1000"
    ports: ["8095:10000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:10000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 30
    depends_on:
      db: { condition: service_healthy }
